name: $(Build.DefinitionName)_$(date:yyyy).$(date:MM).0.$(rev:rr)

trigger:
 branches:
  include:
    - "master"
 paths:
    include:
    - "src/"

variables:
- name: "srcPath"
  value: "$(Build.SourcesDirectory)/src" 
- name: "ConnectionStrings.Storage"
  value: $(ConnectionStrings--Storage)
- name: "ConnectionStrings.Sql"
  value: $(ConnectionStrings--Sql)
- name: "ConnectionStrings.Cosmos"
  value: $(ConnectionStrings--Cosmos)
- name: "Notification.Email.ConnectionString"
  value: $(Notification--Email--ConnectionString)
- name: "LicenseApi.Get"
  value: $(LicenseApi--Get)
- name: "LicenseApi.New"
  value: $(LicenseApi--New)

jobs:
- job: Build_FantasoccerApi_Linux
  displayName: "Build Fantasoccer Web Api on Ubuntu"
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: CopyFiles@2
    inputs:
      SourceFolder: 'ops/prod/api/'
      Contents: 'appsettings.json'
      TargetFolder: "$(srcPath)/Fantasoccer.Applications/Fantasoccer.Applications.Api/"
      OverWrite: true

  - template: ../template/dotnet-build.yml
    parameters:
      buildMode: "release"
      workingDirectory: "$(srcPath)/Fantasoccer.Applications/Fantasoccer.Applications.Api/"
      projects: "Fantasoccer.Applications.Api.csproj"
      executeAllTests: false
      sdkVersion: "7.x"
      artifactName: "fantasoccer_api"
      publishArtifact: true
      #projectTestName: ""