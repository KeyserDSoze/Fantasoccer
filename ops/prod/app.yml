name: $(Build.DefinitionName)_$(date:yyyy).$(date:MM).0.$(rev:rr)

trigger:
 branches:
  include:
    - "master"
 paths:
    include:
    - "src/Fantasoccer.Applications/Fantasoccer.Application.App/"
    - "src/Fantasoccer.Applications/Fantasoccer.Application.Shared/"
    - "src/Fantasoccer.Business.Shared/"
    - "src/Fantasoccer.Domain/"
    - "ops/prod/app"

variables:
- name: "srcPath"
  value: "$(Build.SourcesDirectory)/src" 

jobs:
- job: Build_FantasoccerApi_Linux
  displayName: "Build Fantasoccer Web Api on Ubuntu"
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: CopyFiles@2
    inputs:
      SourceFolder: 'ops/prod/app/'
      Contents: 'appsettings.json'
      TargetFolder: "$(srcPath)/Fantasoccer.Applications/Fantasoccer.Application.App/"
      OverWrite: true

  - template: ../template/dotnet-build.yml
    parameters:
      buildMode: "release"
      workingDirectory: "$(srcPath)/Fantasoccer.Applications/Fantasoccer.Application.App/"
      projects: "Fantasoccer.Application.App.csproj"
      executeAllTests: false
      sdkVersion: "8.x"
      artifactName: "fantasoccer_app"
      publishArtifact: true
      #projectTestName: ""