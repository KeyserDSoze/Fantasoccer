server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Local consent/login URLs must work when opened directly in the browser.
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; return 200 "OK"; }
    # No request/query logging: OAuth callback URLs may contain authorization codes.
    access_log off;
}
