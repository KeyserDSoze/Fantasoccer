name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/Fantasoccer.Applications/Fantasoccer.Application.Api/**'
      - 'src/Fantasoccer.Business/**'
      - 'src/Fantasoccer.Business.BackgroundJobs/**'
      - 'src/Fantasoccer.Business.Shared/**'
      - 'src/Fantasoccer.Domain/**'
      - 'src/Fantasoccer.Infrastructure.Storage/**'
      - 'src/Fantasoccer.Tests/**'
      - 'Fantasoccer.sln'
      - '**/*.csproj'
      - 'ops/prod/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.x'
  API_PROJECT: 'src/Fantasoccer.Applications/Fantasoccer.Application.Api/Fantasoccer.Application.Api.csproj'
  TEST_PROJECT: 'src/Fantasoccer.Tests/Fantasoccer.Tests.csproj'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Build API
        run: dotnet build "${{ env.API_PROJECT }}" --configuration Release --no-restore

      - name: External parser smoke tests
        id: external_parser_smoke
        continue-on-error: true
        env:
          RUN_EXTERNAL_PARSER_TESTS: 'true'
        run: >-
          dotnet test "${{ env.TEST_PROJECT }}"
          --configuration Release
          --filter "Category=External"
          --verbosity quiet

      - name: Warn when external parser smoke tests fail
        if: steps.external_parser_smoke.outcome == 'failure'
        run: echo "::warning title=External parser smoke tests failed::Sky or Mediaset changed their public response. Deployment continues; inspect the failed smoke-test step."

      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --no-restore --output ./publish

      - name: Azure login with client secret
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        uses: azure/cli@v2
        env:
          API_RESOURCE_GROUP: ${{ vars.API_RESOURCE_GROUP }}
          API_APP_NAME: ${{ vars.API_APP_NAME }}
          API_STORAGE_CONNECTION_STRING: ${{ secrets.API_STORAGE_CONNECTION_STRING }}
          API_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.API_APPINSIGHTS_CONNECTION_STRING }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_IV: ${{ secrets.ENCRYPTION_IV }}
        with:
          inlineScript: |
            set -euo pipefail
            required=(API_RESOURCE_GROUP API_APP_NAME API_STORAGE_CONNECTION_STRING API_APPINSIGHTS_CONNECTION_STRING MICROSOFT_CLIENT_SECRET OPENAI_API_KEY ENCRYPTION_KEY ENCRYPTION_IV)
            for name in "${required[@]}"; do
              if [ -z "${!name:-}" ]; then
                echo "Missing GitHub production environment value: $name" >&2
                exit 1
              fi
            done
            az webapp config appsettings set \
              --resource-group "$API_RESOURCE_GROUP" \
              --name "$API_APP_NAME" \
              --settings \
                ConnectionStrings__Storage="$API_STORAGE_CONNECTION_STRING" \
                ConnectionStrings__AppInsights="$API_APPINSIGHTS_CONNECTION_STRING" \
                SocialLogin__Microsoft__ClientSecret="$MICROSOFT_CLIENT_SECRET" \
                OpenAi__ApiKey="$OPENAI_API_KEY" \
                Encryption__Key="$ENCRYPTION_KEY" \
                Encryption__IV="$ENCRYPTION_IV"

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: ./publish
