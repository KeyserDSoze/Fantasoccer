name: Deploy API

# Legacy API (App Service apifc, Azure Storage repositories). The PostgreSQL
# version on main is deployed to apifcv2 by deploy-api-fcv2.yml and must never
# reach apifc. This workflow exists on main only so that it can be started
# manually: choose the "rollback-main" branch in "Use workflow from" and GitHub
# runs that branch's own copy of this file, i.e. the original legacy pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-only-from-rollback-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy the PostgreSQL version to the legacy API
        run: |
          echo "::error::The legacy API (apifc) is deployed only from the rollback-main branch. The current API is deployed by 'Deploy API fcv2'."
          exit 1
