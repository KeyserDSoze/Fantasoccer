name: External Football Sources Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: external-parser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_EXTERNAL_PARSER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.301'
      - name: Read current formation sources and reload a public photo into memory only
        run: dotnet test src/Fantasoccer.Tests/Fantasoccer.Tests.csproj --configuration Release --filter "Category=External" --nologo
