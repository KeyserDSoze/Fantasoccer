name: Deploy GitHub Pages

# Frontend of the PostgreSQL version, served by GitHub Pages (fanta.zone) and
# calling the fcv2 API. The site is replaced only when that API is ready.
#
# Rollback: run this workflow choosing the "rollback-main" branch. GitHub then
# uses that branch's own copy of this file, which builds the previous frontend
# against FRONTEND_API_URL (the legacy apifc API). Keep FRONTEND_API_URL on apifc.
on:
  push:
    branches: [main]
    paths:
      - "src/Fantasoccer.Applications/fantasoccer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  API_URL: ${{ vars.FCV2_API_URL || 'https://apifcv2.azurewebsites.net' }}

jobs:
  api:
    name: fcv2 API ready
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the API (a merge may be deploying it right now)
        run: |
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 10 "$API_URL/health/ready" > /dev/null; then
              echo "API ready: $API_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$API_URL/health/ready did not answer within 15 minutes: the published site is left untouched."
          exit 1

  build:
    needs: api
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/Fantasoccer.Applications/fantasoccer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: src/Fantasoccer.Applications/fantasoccer/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          CI: "1"

      - name: Frontend regression and version tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build Expo web bundle
        run: npx expo export --platform web --output-dir dist --dump-sourcemap
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NONINTERACTIVE: "1"
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}

      - name: Prepare GitHub Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/Fantasoccer.Applications/fantasoccer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
