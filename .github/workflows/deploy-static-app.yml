name: Deploy Static App

on:
  push:
    branches: [main]
    paths:
      - 'src/Fantasoccer.Applications/fantasoccer/**'
      - '.github/workflows/deploy-static-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/Fantasoccer.Applications/fantasoccer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/Fantasoccer.Applications/fantasoccer/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          CI: '1'

      - name: Build Expo web bundle
        run: npx expo export --platform web --output-dir dist --dump-sourcemap
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_NONINTERACTIVE: '1'
          EXPO_PUBLIC_API_URL: ${{ vars.FRONTEND_API_URL }}

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP_DEPLOYMENT_TOKEN }}
          app_location: src/Fantasoccer.Applications/fantasoccer/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
