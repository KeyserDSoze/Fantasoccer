name: Infrastructure fcv2

# Terraform for the new "fcv2" environment (infra/). Validation and plan run
# automatically; apply only by manual dispatch with an explicit confirmation.
# Apply order: container registry -> API image pushed -> rest of the
# environment (the App Service starts from that image) -> image deployed.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-fcv2.yml'
  push:
    branches: [main, 'refactor/postgresql-multi-group']
    paths:
      - 'infra/**'
      - '.github/workflows/infra-fcv2.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'plan = preview only; apply = create/update the Azure resources'
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: 'Required for apply: type the environment name (fcv2)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: infra-fcv2
  cancel-in-progress: false

env:
  TF_VERSION: '1.17.1'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_ENVIRONMENT_NAME: fcv2
  TF_VAR_FILE: environments/fcv2.tfvars

jobs:
  validate:
    name: Format, validate and offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - name: Offline tests (mocked Azure provider)
        run: terraform test
      - name: Scripts syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done

  plan:
    name: Plan
    needs: validate
    # Secrets are not available to pull requests from forks; apply has its own job.
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_encryption_iv: ${{ secrets.ENCRYPTION_IV }}
      TF_VAR_api_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform credentials from the existing app registration
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: scripts/arm-env.sh
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Permissions (Owner expected)
        run: scripts/check-permissions.sh warn
      - name: State backend (read only)
        id: state
        run: scripts/state-backend.sh check
      - name: Init
        run: |
          if [ "${{ steps.state.outputs.exists }}" = "true" ]; then
            terraform init -backend-config=backend.hcl
          else
            # First run: no remote state yet, so the plan shows the whole environment to create.
            echo "::notice title=No Terraform state yet::The state storage is created by the first apply (workflow_dispatch, action=apply)."
            printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
            terraform init
          fi
      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="$TF_VAR_FILE" -out=tfplan
      - name: Plan summary
        run: |
          {
            echo '### Terraform plan — fcv2'
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:|^No changes' | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_encryption_iv: ${{ secrets.ENCRYPTION_IV }}
      TF_VAR_api_image_tag: ${{ github.sha }}
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        working-directory: .
        run: |
          if [ "$CONFIRM" != "$TF_ENVIRONMENT_NAME" ]; then
            echo "::error::Type '$TF_ENVIRONMENT_NAME' in the confirm input to apply."
            exit 1
          fi
          echo "Applying ${TF_ENVIRONMENT_NAME} from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform credentials from the existing app registration
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: scripts/arm-env.sh
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Permissions (Owner required)
        run: scripts/check-permissions.sh require
      - name: Resource providers
        run: scripts/register-providers.sh
      - name: State backend (create if missing)
        run: scripts/state-backend.sh ensure
      - name: Init
        run: terraform init -backend-config=backend.hcl
      - name: Container registry first
        run: >-
          terraform apply -auto-approve -lock-timeout=5m -var-file="$TF_VAR_FILE"
          -target=azurerm_container_registry.api
      - name: Build and push the API image
        run: scripts/push-api-image.sh "$GITHUB_SHA"
      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="$TF_VAR_FILE" -out=tfplan
      - name: Apply
        run: terraform apply -lock-timeout=5m tfplan
      - name: Deploy the API image
        run: scripts/deploy-api-image.sh "$GITHUB_SHA"
      - name: Outputs
        run: |
          {
            echo '### fcv2 — outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
