name: Deploy API fcv2

# Publishes the API to the App Service created by infra-fcv2.yml. App settings
# (Key Vault references) belong to Terraform: this workflow never changes them.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the environment name (fcv2) to deploy'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-api-fcv2
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  API_PROJECT: 'src/Fantasoccer.Applications/Fantasoccer.Application.Api/Fantasoccer.Application.Api.csproj'
  ENVIRONMENT_NAME: fcv2
  RESOURCE_GROUP: fcv2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT_NAME" ]; then
            echo "::error::Type '$ENVIRONMENT_NAME' in the confirm input to deploy."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish API
        run: dotnet publish "$API_PROJECT" --configuration Release --output ./publish
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Locate the App Service created by Terraform
        id: app
        run: |
          name=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?tags.component=='api'].name | [0]" --output tsv --only-show-errors)
          if [ -z "$name" ]; then
            echo "::error::No API App Service in $RESOURCE_GROUP: run the 'Infrastructure fcv2' workflow with action=apply first."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$name" --query defaultHostName --output tsv --only-show-errors)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.app.outputs.name }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./publish
      - name: Liveness check
        env:
          HOST: ${{ steps.app.outputs.host }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 10 "https://$HOST/health/live" > /dev/null; then
              echo "API live on https://$HOST"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$HOST/health/live did not answer within 5 minutes."
          exit 1
