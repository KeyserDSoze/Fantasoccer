name: Deploy API fcv2

# Builds the API container, pushes it to the fcv2 Container Registry and points
# the App Service to it. Settings (Key Vault references) and the managed
# identity pull belong to Terraform (infra-fcv2.yml): this workflow never changes them.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the environment name (fcv2) to deploy'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-api-fcv2
  cancel-in-progress: false

env:
  ENVIRONMENT_NAME: fcv2
  RESOURCE_GROUP: fcv2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT_NAME" ]; then
            echo "::error::Type '$ENVIRONMENT_NAME' in the confirm input to deploy."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push the API image
        run: infra/scripts/push-api-image.sh "$GITHUB_SHA"
      - name: Deploy the image and check liveness
        run: infra/scripts/deploy-api-image.sh "$GITHUB_SHA"
